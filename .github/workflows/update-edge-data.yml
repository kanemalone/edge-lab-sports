name: Update Edge Lab data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sports market data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGION: au
          ODDS_MARKETS: h2h,spreads,totals
        run: python build_edge_data.py
      - name: Commit data
        run: |
          git config user.name "edge-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge-data.json
          git diff --cached --quiet || git commit -m "Update Edge Lab market data"
          git push
